plugins {
    id "com.android.application"
}

android {
    namespace "app.countries.game"
    compileSdk 34

    defaultConfig {
        applicationId "app.countries.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so the APK installs without a store account.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.assets.srcDirs = ["../../web"]
    }
}
